<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condicional if y else</title>
</head>
<body>
    <script>
        const continuar = confirm ("¿Deseas ingresar tus datos?");
        if (continuar){
            let nombre = prompt (" Escribe tu nombre ");
            let edad = Number ( prompt (" Escribe tu edad" ));
            let especialidad = prompt (" Escribe tu especialidad ");
            let direccion = prompt (" Escribe tu direccion");
            let correo = prompt (" Escribe tu correo");
            document.write("Tu nombre es:" + nombre + "<br>");
            document.write("Tu edad es:" + edad + "<br>");
            document.write("Tu especialidad es:" + especialidad + "<br>");
            document.write("Tu direccion es:" + direccion + "<br>");
            document.write("Tu correo es:" + correo + "<br>");
        }
        else{
            alert ("Tengo flojerta");
        }
    
    </script>

    <br><br>

  .volver {
    display: inline-block;
    background: #2c3e50;
    color: white;
    padding: 8px 14px;
    text-decoration: none;
    border-radius: 5px;
    font-family: Arial;
  }
</style>

<a class="volver" href="index.html">← regresar al menu</a>

</body>
</html>
